<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title desc">
  <title id="title">Settra personal LinkedIn banner</title>
  <desc id="desc">Fragmented spreadsheet data becomes an organized data layer and reliable AI workflows.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.64" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#f0f6ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2875f5"/>
      <stop offset="1" stop-color="#0757d9"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dce6f3"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#cfe1ff" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#eaf2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#466b9d" flood-opacity="0.24"/>
    </filter>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#56749c" flood-opacity="0.2"/>
    </filter>
    <g id="sheet">
      <rect width="54" height="50" rx="2" fill="#ffffff" stroke="#bfd0e7" stroke-width="1.4"/>
      <rect width="54" height="10" rx="2" fill="url(#blue)"/>
      <path d="M13.5 10v40M27 10v40M40.5 10v40M0 23.3h54M0 36.6h54" fill="none" stroke="#c6d3e5" stroke-width="1.1"/>
    </g>
    <g id="agentNode">
      <circle r="18" fill="#fff" stroke="#1261e8" stroke-width="1.7"/>
      <circle cy="-5" r="3.5" fill="#0b5de5"/>
      <circle cx="-6" cy="5" r="3.5" fill="#0b5de5"/>
      <circle cx="6" cy="5" r="3.5" fill="#0b5de5"/>
      <path d="M0-2v4M-3 3l-2 1M3 3l2 1" stroke="#0b5de5" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1584" height="396" fill="url(#background)"/>
  <ellipse cx="735" cy="215" rx="445" ry="175" fill="url(#halo)" opacity="0.5"/>

  <!-- Fragmented source data -->
  <g opacity="0.98">
    <use href="#sheet" transform="translate(457 69) rotate(14 27 25)" filter="url(#softShadow)"/>
    <use href="#sheet" transform="translate(448 156) rotate(5 27 25) scale(.91)" filter="url(#softShadow)"/>
    <use href="#sheet" transform="translate(500 132) rotate(19 27 25) scale(.62)" opacity=".68"/>
    <use href="#sheet" transform="translate(408 206) rotate(-10 27 25) scale(.78)" filter="url(#softShadow)"/>
    <use href="#sheet" transform="translate(497 207) rotate(14 27 25) scale(.7)" opacity=".62"/>

    <rect x="393" y="124" width="27" height="27" fill="#1e66e4" transform="rotate(-11 406 137)" opacity=".92"/>
    <rect x="363" y="166" width="28" height="28" fill="#dae6f5" transform="rotate(9 377 180)"/>
    <rect x="400" y="255" width="12" height="12" fill="#a8c3ea"/>
    <rect x="458" y="279" width="13" height="13" fill="#89ace0"/>
    <rect x="548" y="224" width="14" height="14" fill="#1763e4"/>
    <rect x="365" y="96" width="13" height="13" fill="#93b7ed"/>
    <rect x="415" y="78" width="10" height="10" fill="#dbe7f7"/>
    <rect x="425" y="106" width="12" height="12" fill="#a8c4ec"/>
    <rect x="529" y="107" width="12" height="12" fill="#afc8ed"/>
    <rect x="548" y="130" width="13" height="13" fill="#5590eb"/>
    <rect x="350" y="127" width="9" height="9" fill="#dce7f6"/>
    <g fill="#83aae6" opacity=".54">
      <circle cx="385" cy="102" r="2"/><circle cx="432" cy="141" r="2"/><circle cx="438" cy="253" r="2"/>
      <circle cx="519" cy="270" r="2"/><circle cx="540" cy="174" r="2"/><circle cx="579" cy="144" r="2"/>
    </g>
  </g>

  <!-- Pipeline connectors -->
  <g fill="none" stroke="#0b5de5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M571 184h21"/>
    <path d="m585 177 7 7-7 7"/>
    <path d="M692 184h23"/>
    <path d="m708 177 7 7-7 7"/>
    <path d="M834 184h25"/>
    <path d="m852 177 7 7-7 7"/>
  </g>

  <!-- Structured list -->
  <g filter="url(#shadow)">
    <rect x="606" y="148" width="77" height="72" rx="13" fill="#fff"/>
    <g fill="#1763e4">
      <circle cx="624" cy="167" r="5"/><circle cx="624" cy="184" r="5"/><circle cx="624" cy="202" r="5"/>
    </g>
    <g stroke="#c8d3e2" stroke-width="6" stroke-linecap="round">
      <path d="M638 167h26"/><path d="M638 184h26"/><path d="M638 202h26"/>
    </g>
  </g>

  <!-- Data layer -->
  <g filter="url(#shadow)">
    <path d="M739 160v65c0 11 20 20 45 20s45-9 45-20v-65z" fill="url(#steel)" stroke="#aabbd3" stroke-width="1.4"/>
    <path d="M739 181c0 11 20 20 45 20s45-9 45-20M739 203c0 11 20 20 45 20s45-9 45-20" fill="none" stroke="#aabbd3" stroke-width="1.4"/>
    <ellipse cx="784" cy="160" rx="45" ry="17" fill="url(#blue)"/>
    <g fill="#0757d9"><circle cx="816" cy="180" r="3.6"/><circle cx="816" cy="202" r="3.6"/><circle cx="816" cy="224" r="3.6"/></g>
  </g>

  <!-- AI workflow network -->
  <g>
    <circle cx="928" cy="184" r="56" fill="none" stroke="#a9c6ee" stroke-width="3" stroke-dasharray="2 7"/>
    <path d="M928 150v-17M900 203l-14 13M956 203l14 13" stroke="#9abbea" stroke-width="2"/>
    <circle cx="928" cy="184" r="20" fill="url(#blue)" filter="url(#softShadow)"/>
    <circle cx="928" cy="178" r="6" fill="#fff"/>
    <path d="M916 197c2-8 7-12 12-12s10 4 12 12" fill="#fff"/>
    <use href="#agentNode" transform="translate(928 128)" filter="url(#softShadow)"/>
    <use href="#agentNode" transform="translate(886 222)" filter="url(#softShadow)"/>
    <use href="#agentNode" transform="translate(970 222)" filter="url(#softShadow)"/>
  </g>

  <!-- Positioning statement -->
  <text x="1020" y="176" fill="#0a1424" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="-1">
    <tspan x="1020" dy="0">From fragmented data and AI</tspan>
    <tspan x="1020" dy="34">prototypes to reliable production systems.</tspan>
  </text>
</svg>
