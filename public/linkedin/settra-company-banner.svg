<svg xmlns="http://www.w3.org/2000/svg" width="1512" height="256" viewBox="0 0 1512 256" role="img" aria-labelledby="title desc">
  <title id="title">Settra LinkedIn company banner</title>
  <desc id="desc">Spreadsheets flow through a reliable data layer to AI agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1266ef"/>
      <stop offset="1" stop-color="#0054d8"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#dce6f2"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-50%" width="180%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#4e6f9a" flood-opacity="0.25"/>
    </filter>
    <g id="sheet">
      <rect width="70" height="58" rx="3" fill="#fff" stroke="#bacce4" stroke-width="1.4"/>
      <rect width="70" height="11" rx="3" fill="url(#blue)"/>
      <path d="M17.5 11v47M35 11v47M52.5 11v47M0 26.5h70M0 42h70" fill="none" stroke="#c4d2e4" stroke-width="1.2"/>
    </g>
  </defs>

  <rect width="1512" height="256" fill="url(#background)"/>

  <!-- Quiet data-flow background -->
  <path d="M-30 61C89 44 151 150 266 140c63-5 114-43 169-36 60 7 82 49 139 44" fill="none" stroke="#dbe8ff" stroke-width="20" opacity=".3"/>
  <path d="M-30 74C90 58 150 162 267 152c62-5 113-41 168-35 62 7 86 48 143 42" fill="none" stroke="#e8f0fd" stroke-width="8" opacity=".72"/>
  <path d="M1161 157c73 7 117-45 180-41 59 4 98 49 201 39" fill="none" stroke="#dce9ff" stroke-width="20" opacity=".27"/>
  <path d="M1157 148c73 7 119-43 184-39 57 4 98 47 201 37" fill="none" stroke="#edf3fd" stroke-width="7" opacity=".82"/>
  <g fill="#1465ea">
    <circle cx="85" cy="105" r="5"/><circle cx="152" cy="147" r="4.5" opacity=".52"/><circle cx="198" cy="91" r="5" opacity=".78"/><circle cx="296" cy="148" r="4.5"/>
    <circle cx="1338" cy="148" r="4.5"/><circle cx="1430" cy="77" r="4.8" opacity=".63"/><circle cx="1437" cy="137" r="4.8" opacity=".58"/>
  </g>

  <!-- Spreadsheet sources -->
  <g filter="url(#shadow)">
    <use href="#sheet" transform="translate(370 79) scale(.88)" opacity=".9"/>
    <use href="#sheet" transform="translate(484 75) scale(.88)" opacity=".78"/>
    <use href="#sheet" transform="translate(414 101) scale(1.28)"/>
  </g>

  <!-- Arrow to data layer -->
  <g fill="none" stroke="#065be5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M562 120h42" stroke-dasharray="1 8"/>
    <path d="M594 110l11 10-11 10"/>
  </g>

  <!-- Reliable data layer -->
  <g filter="url(#shadow)">
    <path d="M625 98v54c0 11 19 20 42 20s42-9 42-20V98z" fill="url(#steel)" stroke="#aabbd2" stroke-width="1.3"/>
    <path d="M625 117c0 11 19 20 42 20s42-9 42-20M625 136c0 11 19 20 42 20s42-9 42-20" fill="none" stroke="#aabbd2" stroke-width="1.3"/>
    <ellipse cx="667" cy="98" rx="42" ry="15" fill="url(#blue)"/>
    <g fill="#0757d9"><circle cx="698" cy="116" r="3.3"/><circle cx="698" cy="136" r="3.3"/><circle cx="698" cy="155" r="3.3"/></g>
  </g>

  <!-- Arrow to agent -->
  <g fill="none" stroke="#065be5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M727 120h42" stroke-dasharray="1 8"/>
    <path d="M759 110l11 10-11 10"/>
  </g>

  <!-- AI agent mark -->
  <g filter="url(#shadow)">
    <circle cx="840" cy="121" r="54" fill="#fff" stroke="#075bea" stroke-width="2.4"/>
    <path d="M840 96v29M840 125l-25 17M840 125l25 17" fill="none" stroke="#075bea" stroke-width="4" stroke-linecap="round"/>
    <circle cx="840" cy="92" r="9" fill="url(#blue)"/>
    <circle cx="814" cy="142" r="9" fill="url(#blue)"/>
    <circle cx="866" cy="142" r="9" fill="url(#blue)"/>
    <circle cx="840" cy="125" r="7" fill="#075bea"/>
  </g>

  <!-- Product promise -->
  <text x="929" y="111" fill="#091322" font-family="Inter, Arial, Helvetica, sans-serif" font-size="36" font-weight="750" letter-spacing="-1.2">
    <tspan x="929" dy="0">Reliable spreadsheet</tspan>
    <tspan x="929" dy="43">data for AI agents.</tspan>
  </text>
</svg>
